version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cloudoptima-db
    restart: always
    environment:
      POSTGRES_USER: cloudoptima
      POSTGRES_PASSWORD: cloudoptima_secure_password
      POSTGRES_DB: cloudoptima
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudoptima"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudoptima-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudoptima-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://cloudoptima:cloudoptima_secure_password@db:5432/cloudoptima
      - DEMO_MODE=true
      - SECRET_KEY=super-secret-cloudoptima-key-change-in-prod-2026
      - SCAN_INTERVAL_MINUTES=180
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    container_name: cloudoptima-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
